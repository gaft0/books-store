<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="header.css">
    <link rel="stylesheet" href="footer.css">
    <link rel="icon" href="assets/favicon.png">
    <title>Books Store | gaft0</title>

<body>
    <div style="display: flex; flex-direction: column; min-height: 100vh;">
        <header style="background-color: #E9D5FF;">
            <div class="header-container">
                <h1>Books</h1>
                <div class="header-container-nav">
                    <nav>
                        <ul class="header-nav">
                            <li class="header-list-element"><button class="header-button" onclick="location.href='index.html'">HOME</button></li>
                            <li class="header-list-element"><button class="header-button" onclick="location.href='explore.html'">EXPLORE</button></li>

                        </ul>
                    </nav>
                    <div class="basket-icon-container">

                    </div>
                </div>
            </div>
        </header>
        <main>
            <section class="fourth-section" style="background-color: #E9D5FF;">
                <div class="fourth-section-container">
                    <div>
                        <h2 class="fourth-section-text">Find Your Favorite — 1200+ Books Available</h2>
                        <div class="search-container" style="width: 38.4rem;">
                            <img src="assets/magnifer.svg" alt="Magnifer" class="magnifer">
                            <input class="search-container-text" type="text" placeholder="Search for Books...">
                        </div>
                    </div>
                    <img src="assets/books.png" alt="Books" class="award">
                </div>   
            </section>
            <section class="second-section-container">
                <div class="second-section-title">New Releases</div>
                <ul class="tape-of-cards-container">

                </ul>
            </section>
            <section class="second-section-container">
                <div class="second-section-title">Top Rated Books</div>
                <ul class="tape-of-cards-container">

                </ul>
            </section>
            <section class="second-section-container">
                <div class="second-section-title">Our Suggestion</div>
                <ul class="tape-of-cards-container">

                </ul>
            </section>
            <section class="second-section-container">
                <div class="second-section-title">Most Popular Books</div>
                <ul class="tape-of-cards-container">

                </ul>
            </section>
        </main>
        <footer>
            <div class="footer-container">
                <div class="up-footer">
                    <div class="footer-first-section">
                        <h2 class="footer-first-section-title">Books</h2>
                        <h3 class="footer-first-section-text">Books Delivered. Imagination Unlimited.</h3>
                    </div>
                    <div class="footer-second-section">
                        <h2 class="footer-second-section-title">Quick Links</h2>
                        <ul style="list-style: none; margin: 0 0 0 -1.2rem;">
                            <li class="footer-list"><button class="button-footer">Home</button></li>
                            <li class="footer-list"><button class="button-footer">About Us</button></li>
                            <li class="footer-list"><button class="button-footer">Contact</button></li>
                        </ul>
                    </div>
                    <div class="footer-third-section">
                        <h2 class="footer-third-section-title">Contact</h2>
                        <ul style="list-style: none;">
                            <li class="footer-list"><button class="button-footer" onclick="window.location.href='mailto:mssonukr@gmail.com'">Email: mssonukr@gmail.com</button></li>
                            <li class="footer-list"><button class="button-footer" onclick="window.location.href='tel:+917061543815'">Phone: +91 7061543815</button></li>
                            <li class="footer-list"><button class="button-footer" onclick="window.location.href='https://yandex.by/maps/geo/mullana/2239366727/?ll=140.890337%2C-36.878508&source=serp_navig&z=17.1'">
                                MMEC, Mullana - 133207</button>
                            </li>
                        </ul>
                    </div>
                    <div class="footer-fourth-section">
                        <h2 class="footer-fourth-section-title">We Accept</h2>
                        <ul style="list-style: none; display: flex; margin: 0 0 0 -3rem;">
                            <li class="footer-list"><img src="assets/visa.png" alt="Logo Visa"></li>
                            <li class="footer-list"><img src="assets/mastercard.png" alt="Logo Mastercard"></li>
                            <li class="footer-list"><img src="assets/american-express.png" alt="Logo American Express"></li>
                        </ul>
                    </div>
                </div>
                <div class="down-footer">
                    © 2025 Books. All rights reserved. | Made By Sonu ❤
                </div>
            </div>
