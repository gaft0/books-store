<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Books Store | gaft0</title>

<body>
    <header>
        <h1>Books</h1>
        <div class="header-container-nav">
