<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="basket.css">
    <link rel="stylesheet" href="header.css">
    <link rel="stylesheet" href="footer.css">
    <link rel="icon" href="assets/favicon.png">
    <title>Books Store | gaft0</title>
</head>
<body>
    <div style="display: flex; flex-direction: column; min-height: 100vh; background-color: #FAFAFA;">
        <header style="background-color: #FAFAFA;">
            <div class="header-container">
                <h1>Books</h1>
                <div class="header-container-nav">
                    <nav>
                        <ul class="header-nav">
                            <li class="header-list-element"><button class="header-button" onclick="location.href='index.html'">HOME</button></li>
                            <li class="header-list-element"><button class="header-button" onclick="location.href='explore.html'">EXPLORE</button></li>
                            <li class="header-list-element"><button class="header-button">SHOP</button></li>
                            <li class="header-list-element"><button class="header-button">SELL YOUR BOOK</button></li>
                        </ul>
                    </nav>
                    <div class="basket-icon-container">
                        <div class="basket-red-circle"></div>
                        <button class="header-button" onclick="location.href='basket.html'"><img src="assets/basket.svg" alt="Your basket" class="basket-icon"></button>
                    </div>
                </div>
            </div>
        </header>
        <main>
            <section class="basket-section">
                <div class="basket-section-container">
                    <div class="basket-section-info-container">
                        <div class="basket-title-container">
                            <span class="basket-title">Your Cart</span>
                            <span class="basket-text">0 items</span>
                        </div>
                        <div class="basket-carts-and-order-container">
                            <ul style="margin: 0;" id="basket">

                            </ul>
                            <div>
                                <div class="basket-order-container">
                                    <div class="basket-order-title">Order Summary</div>
                                    <div class="basket-order-subtotal-and-shipping">
                                        <span class="basket-order-subtotal-and-shipping-text">Subtotal</span>
                                        <span class="basket-order-subtotal-and-shipping-cash" id="subtotal">₹0</span>
                                    </div>
                                    <div class="basket-order-subtotal-and-shipping">
                                        <span class="basket-order-subtotal-and-shipping-text">Shipping</span>
                                        <span class="basket-order-subtotal-and-shipping-cash" id="shipping">₹0</span>
                                    </div>
                                    <div class="basket-order-promotion">Spend ₹500 more to get <span style="font-weight: 700;">FREE Shipping!</span></div>
                                    <div class="basket-order-line-flex">
                                        <div class="basket-order-line"></div>
                                    </div>
                                    <div class="basket-order-total">
                                        <span>Total</span>
                                        <span id="total">₹0</span>
                                    </div>
                                    <div class="basket-order-button-flex">
                                        <button class="basket-order-button">Proceed to Checkout</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
        <footer>
            <div class="footer-container">
                <div class="up-footer">
                    <div class="footer-first-section">
                        <h2 class="footer-first-section-title">Books</h2>
                        <h3 class="footer-first-section-text">Books Delivered. Imagination Unlimited.</h3>
                    </div>
                    <div class="footer-second-section">
                        <h2 class="footer-second-section-title">Quick Links</h2>
                        <ul style="list-style: none; margin: 0 0 0 -1.2rem;">
                            <li class="footer-list"><button class="button-footer">Home</button></li>
                            <li class="footer-list"><button class="button-footer">About Us</button></li>
                            <li class="footer-list"><button class="button-footer">Contact</button></li>
                        </ul>
                    </div>
                    <div class="footer-third-section">
                        <h2 class="footer-third-section-title">Contact</h2>
                        <ul style="list-style: none;">
                            <li class="footer-list"><button class="button-footer" onclick="window.location.href='mailto:mssonukr@gmail.com'">Email: mssonukr@gmail.com</button></li>
                            <li class="footer-list"><button class="button-footer" onclick="window.location.href='tel:+917061543815'">Phone: +91 7061543815</button></li>
                            <li class="footer-list"><button class="button-footer" onclick="window.location.href='https://yandex.by/maps/geo/mullana/2239366727/?ll=140.890337%2C-36.878508&source=serp_navig&z=17.1'">
                                MMEC, Mullana - 133207</button>
                            </li>
                        </ul>
                    </div>
                    <div class="footer-fourth-section">
                        <h2 class="footer-fourth-section-title">We Accept</h2>
                        <ul style="list-style: none; display: flex; margin: 0 0 0 -3rem;">
                            <li class="footer-list"><img src="assets/visa.png" alt="Logo Visa"></li>
                            <li class="footer-list"><img src="assets/mastercard.png" alt="Logo Mastercard"></li>
                            <li class="footer-list"><img src="assets/american-express.png" alt="Logo American Express"></li>
                        </ul>
                    </div>
                </div>
                <div class="down-footer">
                    © 2025 Books. All rights reserved. | Made By Sonu ❤
                </div>
            </div>
        </footer>
    </div>
    <script src="script.js"></script>
    <script src="basket.js"></script>
</body>
</html>
